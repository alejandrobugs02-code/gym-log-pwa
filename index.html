<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Gym</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<main id="view" class="view" aria-live="polite"></main>

<div id="rest" class="rest hidden" role="status" aria-live="polite">
  <span id="restLabel" class="rest-time">0:00</span>
  <span class="rest-text">descanso</span>
  <button id="restSkip" class="rest-skip" type="button" aria-label="Saltar descanso">✕</button>
</div>

<nav class="tabs" aria-label="Secciones">
  <button class="tab" data-tab="hoy" type="button"><span class="tab-ico">🏋️</span><span>Hoy</span></button>
  <button class="tab" data-tab="historial" type="button"><span class="tab-ico">📈</span><span>Historial</span></button>
  <button class="tab" data-tab="cuerpo" type="button"><span class="tab-ico">⚖️</span><span>Cuerpo</span></button>
  <button class="tab" data-tab="ajustes" type="button"><span class="tab-ico">⚙️</span><span>Ajustes</span></button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
