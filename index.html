<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Gym</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header id="topbar" class="topbar">
  <div class="topbar-left">
    <span class="topbar-logo">Gym</span>
  </div>
  <div class="topbar-right">
    <button id="syncBadge" class="sync-badge" type="button" aria-label="Estado de sincronización" data-action="open-sync-modal" data-status="synced" title="Sincronización">Al día</button>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<div id="rest" class="rest hidden" role="status" aria-live="polite">
  <button id="restMinus" class="rest-adj" type="button" aria-label="Quitar 15 segundos">−15</button>
  <span id="restLabel" class="rest-time">0:00</span>
  <span class="rest-text">descanso</span>
  <button id="restPlus" class="rest-adj" type="button" aria-label="Sumar 15 segundos">+15</button>
  <button id="restSkip" class="rest-skip" type="button" aria-label="Saltar descanso">✕</button>
</div>

<nav class="tabs" aria-label="Secciones">
  <button class="tab" data-tab="hoy" type="button"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg></span><span>Hoy</span></button>
  <button class="tab" data-tab="historial" type="button"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg></span><span>Historial</span></button>
  <button class="tab" data-tab="cuerpo" type="button"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 10a4.5 4.5 0 0 1 7 0M12 10l1.5-2"/></svg></span><span>Cuerpo</span></button>
  <button class="tab" data-tab="ajustes" type="button"><span class="tab-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span>Ajustes</span></button>
</nav>

<div id="syncModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="syncModalTitle">
  <div class="modal-backdrop" data-action="close-sync-modal"></div>
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="syncModalTitle" class="modal-title">Sincronización</h2>
      <button class="btn-close" type="button" data-action="close-sync-modal" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="sync-status-box">
        <span id="syncModalBadge" class="sync-modal-badge" data-status="synced">Al día</span>
        <div>
          <div id="syncModalStatusText" class="sync-status-text">Sincronizado</div>
          <div id="syncModalDetail" class="sync-detail-text">0 eventos pendientes</div>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="syncEndpointInput">Endpoint del Worker (URL)</label>
        <input id="syncEndpointInput" type="url" placeholder="https://gym-sync.usuario.workers.dev" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field" style="margin-top:10px">
        <label for="syncTokenInput">Token de sincronización (Bearer)</label>
        <input id="syncTokenInput" type="password" placeholder="Tu token secreto" autocomplete="off">
      </div>
      <div class="row" style="margin-top:14px;gap:8px">
        <button class="btn-primary" data-action="save-sync-config" type="button" style="flex:1">Guardar</button>
        <button class="btn-ghost" data-action="test-sync" type="button" style="flex:1">Probar</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn-ghost" data-action="manual-sync" type="button" style="width:100%">Sincronizar ahora</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
